<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#010C28" />
    <title>Offline · Pixely Workspace</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { display: flex; align-items: center; justify-content: center; background: #010C28; color: #fff;
             font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
      img { width: 72px; height: 72px; margin-bottom: 20px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: #A9B3CC; margin: 0 0 20px; font-size: 15px; }
      button { background: #4576FF; color: #fff; border: 0; border-radius: 8px; padding: 12px 22px; font-size: 15px; min-height: 44px; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Pixely Workspace needs a connection to load your orders.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
